x-healthcheck-timings: &healthcheck-timings
  interval: 2m           # Une fois les conteneurs lances, un healthcheck est effectue toutes les 2 min
  timeout: 5s            # Si une verif prend plus de 5s, elle est consideree comme echouee
  retries: 5             # 5 echecs consecutifs avant de declarer le service unhealthy
  start_period: 60s      # Periode avant le demarrage : les echecs ne comptent pas pendant 60s
  start_interval: 5s     # Pendant le start_period, on verifie toutes les 5s pour detecter rapidement le UP

services:
  patient-service_db:
    image: mysql:9.6
    ports:
      - "3307:3306"
    env_file:
      - env.properties
    environment:
      - TZ=Europe/Paris
    volumes:
      - patient-service:/var/lib/mysql
      - ./patient-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  patient-service:
    build:
      context: .
      dockerfile: ./patient-service/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - env.properties
    environment:
      - MYSQL_HOST=patient-service_db
      - MYSQL_PORT=3306
      - TZ=Europe/Paris
    depends_on:
      patient-service_db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health/readiness || exit 1"]

  note-praticien-service_db:
    image: mongo:8.3
    ports:
      - "27018:27017"
    env_file:
      - env.properties
    environment:
      - TZ=Europe/Paris
    volumes:
      - note-praticien-service:/data/db
      - ./note-praticien-service/src/main/resources/init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]

  note-praticien-service:
    build:
      context: .
      dockerfile: ./note-praticien-service/Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - env.properties
    environment:
      - MONGODB_HOST=note-praticien-service_db
      - MONGODB_PORT=27017
      - TZ=Europe/Paris
    depends_on:
      note-praticien-service_db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health/readiness || exit 1"]

  evaluation-risque-service:
    build:
      context: .
      dockerfile: ./evaluation-risque-service/Dockerfile
    ports:
      - "8084:8084"
    env_file:
      - env.properties
    environment:
      - TZ=Europe/Paris
      - patient-service_URL=http://patient-service:8082
      - note-praticien-service_URL=http://note-praticien-service:8083
    depends_on:
      patient-service:
        condition: service_healthy
      note-praticien-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health/readiness || exit 1"]

  frontend-service:
    build:
      context: .
      dockerfile: ./frontend-service/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - env.properties
    environment:
      - TZ=Europe/Paris
      - PATIENT_SERVICE_URL=http://patient-service:8082
      - NOTE_PRATICIEN_SERVICE_URL=http://note-praticien-service:8083
      - EVALUATION_RISQUE_SERVICE_URL=http://evaluation-risque-service:8084
    depends_on:
      patient-service:
        condition: service_healthy
      note-praticien-service:
        condition: service_healthy
      evaluation-risque-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health/readiness || exit 1"]

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - env.properties
    environment:
      - TZ=Europe/Paris
      - FRONTEND_SERVICE_URL=http://frontend-service:8081
    depends_on:
      frontend-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timings
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]

volumes:
  patient-service:
  note-praticien-service:
