spring.application.name=api-gateway

# Fichier env.properties à créer/positionner à la racine du projet depuis env.properties.example
spring.config.import=optional:file:../env.properties

#Logging
# "INFO" : log tous les .info, .warn et .error ; "DEBUG" : log tout ça + les .debug
logging.level.com.medilabosolutions.apigateway=${APP_LOGGING_LEVEL:INFO}

server.port=${API_GATEWAY_PORT}

medilabo.username=${MEDILABO_USERNAME}
medilabo.password=${MEDILABO_PASSWORD}

# Spring Cloud Gateway : router tout le trafic vers le frontend
spring.cloud.gateway.server.webmvc.routes[0].id=frontend
spring.cloud.gateway.server.webmvc.routes[0].uri=${FRONTEND_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/**
# Forcer les X-Forwarded-* pour que le frontend (avec forward-headers-strategy=framework)
# construise ses URLs absolues avec l'adresse publique de la Gateway et non l'hote Docker
# interne (frontend-service:8081). Surchargeables via env pour un deploiement non-local.
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=AddRequestHeader=X-Forwarded-Host, ${GATEWAY_PUBLIC_HOST:localhost:${API_GATEWAY_PORT}}
spring.cloud.gateway.server.webmvc.routes[0].filters[1]=AddRequestHeader=X-Forwarded-Proto, ${GATEWAY_PUBLIC_PROTO:http}
spring.cloud.gateway.server.webmvc.routes[0].filters[2]=AddRequestHeader=X-Forwarded-Port, ${API_GATEWAY_PORT}

# Actuator : uniquement /health expose pour le healthcheck Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
