<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${mode == 'creation'} ? 'Ajouter un patient' : 'Modifier le patient')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">

    <hgroup>
        <h1 th:text="${mode == 'creation'} ? 'Ajouter un patient' : 'Modifier le patient'">Formulaire patient</h1>
        <p th:text="${mode == 'creation'} ? 'Saisir les informations du nouveau patient' : 'Mettre à jour les informations du patient'">Sous-titre</p>
    </hgroup>

    <form th:action="${mode == 'creation'} ? @{/patients} : @{/patients/{id}(id=${patientDto.id})}"
          th:object="${patientDto}"
          method="post">

        <input th:if="${mode == 'edition'}" type="hidden" name="_method" value="PUT">

        <label for="nom">Nom</label>
        <input type="text" id="nom" th:field="*{nom}" required>
        <small th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" style="color: var(--pico-color-red-500);">Erreur nom</small>

        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" th:field="*{prenom}" required>
        <small th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}" style="color: var(--pico-color-red-500);">Erreur prénom</small>

        <label for="dateNaissance">Date de naissance</label>
        <input type="date" id="dateNaissance" th:field="*{dateNaissance}" required>
        <small th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}" style="color: var(--pico-color-red-500);">Erreur date</small>

        <label for="genre">Genre</label>
        <select id="genre" th:field="*{genre}" required>
            <option value="">-- Sélectionner --</option>
            <option value="M">Masculin</option>
            <option value="F">Féminin</option>
        </select>
        <small th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}" style="color: var(--pico-color-red-500);">Erreur genre</small>

        <label for="adresse">Adresse</label>
        <input type="text" id="adresse" th:field="*{adresse}">
        <small th:if="${#fields.hasErrors('adresse')}" th:errors="*{adresse}" style="color: var(--pico-color-red-500);">Erreur adresse</small>

        <label for="telephone">Téléphone</label>
        <input type="text" id="telephone" th:field="*{telephone}">
        <small th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}" style="color: var(--pico-color-red-500);">Erreur téléphone</small>

        <div role="group">
            <button type="submit">Enregistrer</button>
            <a th:href="${mode == 'creation'} ? @{/patients} : @{/patients/{id}(id=${patientDto.id})}"
               role="button" class="secondary">Annuler</a>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
